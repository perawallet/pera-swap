name: Test / Live API contract

# Weekly read-only check that the real Pera API still matches the SDK's types.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: Live API contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run live contract tests
        env:
          PERA_LIVE_API: "1"
          # Optional repo variable: a funded mainnet address for quote checks.
          PERA_LIVE_SWAPPER_ADDRESS: ${{ vars.PERA_LIVE_SWAPPER_ADDRESS }}
        run: pnpm test:live
