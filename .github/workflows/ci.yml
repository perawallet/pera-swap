name: CI / Pre-Merge

on:
  pull_request:
  push:
    branches: [main]

# Least-privilege default. Jobs that need more should override locally.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, test & build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          cache: pnpm

      # Fails if pnpm-lock.yaml drifted from package.json.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Lint (type-aware)
        run: pnpm lint:types

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test:coverage

      # tsdown also runs publint and are-the-types-wrong against the output.
      - name: Build library
        run: pnpm build

      - name: Build example app
        run: |
          pnpm --filter pera-swap-react-example typecheck
          pnpm --filter pera-swap-react-example build

  audit:
    name: Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions

      # npm retired the legacy audit endpoints and pnpm 10 never got
      # bulk-advisory support, so run just the audit through pnpm 11
      # (same approach as pera-react-native).
      - name: pnpm audit (runtime)
        run: >
          pnpm dlx --config.minimumReleaseAge=0 pnpm@11.13.0
          --pm-on-fail=ignore --config.manage-package-manager-versions=false
          audit --prod --audit-level=moderate

      - name: pnpm audit (all, informational)
        if: always()
        run: >
          pnpm dlx --config.minimumReleaseAge=0 pnpm@11.13.0
          --pm-on-fail=ignore --config.manage-package-manager-versions=false
          audit --audit-level=low || true

  gitleaks:
    name: Secret scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans history; need more than a shallow clone
          fetch-depth: 0
          persist-credentials: false

      # The upstream binary, verified against a pinned SHA256. Bumping
      # GITLEAKS_VERSION requires updating the hash from the release's
      # gitleaks_<ver>_checksums.txt (linux_x64 line).
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xz -C /usr/local/bin -f "${tarball}" gitleaks
          rm "${tarball}"

      - name: Scan PR diff for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gitleaks git \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" \
            --redact \
            --verbose

  ci-lint:
    name: Lint workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "${tarball}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xz -C /usr/local/bin -f "${tarball}" actionlint
          rm "${tarball}"

      # Also shellchecks every `run:` block.
      - name: Lint workflows
        run: actionlint

      - name: Lint shell scripts
        run: shellcheck --severity=warning tools/hooks/*
